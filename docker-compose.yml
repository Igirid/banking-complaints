version: "3.9"

services:
  api:
    build: .
    container_name: banking-complaints-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://app:app@db:3306/banking_complaints
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: banking-complaints-db
    restart: always
    environment:
      MARIADB_DATABASE: banking_complaints
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
